<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fluffy Pink Unicorn Dance</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#b3e5ff, #ffe6f2);
    overflow: hidden;
    font-family: sans-serif;
  }

  .stage {
    text-align: center;
    z-index: 2;
  }

  .unicorn {
    font-size: 120px;
    display: inline-block;
    animation: dance 0.6s infinite alternate ease-in-out;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
  }

  .sparkles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .sparkle {
    position: absolute;
    color: #ffb6f0;
    animation: float 2s infinite ease-in-out;
    opacity: 0.8;
  }

  @keyframes dance {
    0%   { transform: rotate(-10deg) translateY(0px) scale(1); }
    100% { transform: rotate(10deg) translateY(-10px) scale(1.05); }
  }

  @keyframes float {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
  }

  .music {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 3;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="unicorn">🦄</div>
  <h2 style="color:#ff69b4;">Fluffy Pink Unicorn Dance Party</h2>
</div>

<!-- Sparkles -->
<div class="sparkles" id="sparkles"></div>

<!-- Music (Firework by Katy Perry) -->
<div class="music">
  <iframe width="200" height="113"
    src="https://www.youtube.com/embed/QGJuMBdaqIw?autoplay=1&loop=1&playlist=QGJuMBdaqIw"
    title="Firework - Katy Perry"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

<script>
  const sparklesContainer = document.getElementById("sparkles");

  function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.innerHTML = "✨";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = "80vh";
    sparkle.style.fontSize = (10 + Math.random() * 20) + "px";
    sparkle.style.animationDuration = (1 + Math.random() * 2) + "s";

    sparklesContainer.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 3000);
  }

  setInterval(createSparkle, 200);
</script>

</body>
</html>
