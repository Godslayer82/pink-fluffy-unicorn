<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fluffy Pink Unicorn Dance</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(#b3e5ff, #ffe6f2);
    overflow: hidden;
    font-family: sans-serif;
  }

  .stage {
    text-align: center;
    z-index: 2;
  }

  .unicorn {
    font-size: 120px;
    display: inline-block;
    animation: dance 0.6s infinite alternate ease-in-out;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
  }

  .sparkles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .sparkle {
    position: absolute;
    color: #ffb6f0;
    animation: float 2s infinite ease-in-out;
    opacity: 0.8;
  }

  @keyframes dance {
    0%   { transform: rotate(-10deg) translateY(0px) scale(1); }
    100% { transform: rotate(10deg) translateY(-10px) scale(1.05); }
  }

  @keyframes float {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
  }

  .hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 14px;
    color: #ff69b4;
    z-index: 3;
  }
</style>
</head>

<body>

<div class="stage">
  <div class="unicorn">🦄</div>
  <h2 style="color:#ff69b4;">Fluffy Pink Unicorn Dance Party</h2>
</div>

<div class="sparkles" id="sparkles"></div>

<div class="hint">Press SPACE to play/pause music 🎵</div>

<!-- YouTube player (hidden) -->
<div id="player"></div>

<script>
  const sparklesContainer = document.getElementById("sparkles");

  function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.innerHTML = "✨";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = "80vh";
    sparkle.style.fontSize = (10 + Math.random() * 20) + "px";
    sparkle.style.animationDuration = (1 + Math.random() * 2) + "s";

    sparklesContainer.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 3000);
  }

  setInterval(createSparkle, 200);

  // --- YouTube API setup ---
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '0',
      width: '0',
      videoId: 'QGJuMBdaqIw', // Firework - Katy Perry
      playerVars: {
        autoplay: 0,
        loop: 1,
        playlist: 'QGJuMBdaqIw'
      }
    });
  }

  // Load YouTube API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  // Spacebar control
  document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
      e.preventDefault(); // stop page scroll

      if (player && player.getPlayerState) {
        const state = player.getPlayerState();

        // 1 = playing, 2 = paused
        if (state === 1) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      }
    }
  });
</script>

</body>
</html>
